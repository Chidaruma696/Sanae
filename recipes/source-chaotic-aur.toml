name = "Chaotic-AUR"
summary = "Prebuilt AUR packages: install thousands of AUR programs without compiling"
category = "Sources"
check = "grep -q '^\\[chaotic-aur\\]' /etc/pacman.conf"
notes = "Community-run: packages are built by Chaotic-AUR's maintainers, not by Arch. Widely used; still a third party."

[[commands]]
run = "pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com && pacman-key --lsign-key 3056513887B78AEB"

[[commands]]
run = "pacman -U --noconfirm --needed 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'"

[[commands]]
run = "grep -q '^\\[chaotic-aur\\]' /etc/pacman.conf || printf '\\n[chaotic-aur]\\nInclude = /etc/pacman.d/chaotic-mirrorlist\\n' >> /etc/pacman.conf"

[[commands]]
run = "pacman -Sy"
