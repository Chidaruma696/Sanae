[package]
name = "sanae"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A software store for Arch Linux that lives in the terminal: browse, install, and configure"
license = "MIT"
repository = "https://github.com/Chidaruma696/Sanae"
keywords = ["archlinux", "pacman", "aur", "tui", "package-manager"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
flate2 = "1"
nucleo-matcher = "0.3"
portable-pty = "0.9"
quick-xml = "0.37"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "sync"] }
toml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
