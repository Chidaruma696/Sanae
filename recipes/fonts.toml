name = "Fonts"
summary = "Noto (with CJK and emoji), DejaVu, Liberation, JetBrains Mono Nerd, Fira Code, Roboto, Hack, Microsoft-compatible fonts, and sane fontconfig defaults"
category = "Look"
packages = ["noto-fonts", "noto-fonts-cjk", "noto-fonts-emoji", "noto-fonts-extra", "ttf-dejavu", "ttf-liberation", "ttf-jetbrains-mono-nerd", "ttf-fira-code", "ttf-roboto", "ttf-hack", "adobe-source-code-pro-fonts"]
aur = ["ttf-ms-fonts"]
check = "fc-list 2>/dev/null | grep -q JetBrainsMono"
notes = "Log out and back in so every program picks the new fonts up."

[[files]]
path = "/etc/fonts/local.conf"
mode = "0644"
content = """<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Noto Sans</family><family>Noto Sans CJK JP</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family><family>Noto Serif CJK JP</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Sans Mono CJK JP</family></prefer></alias>
  <match target="font"><edit name="antialias" mode="assign"><bool>true</bool></edit><edit name="hinting" mode="assign"><bool>true</bool></edit><edit name="hintstyle" mode="assign"><const>hintslight</const></edit><edit name="rgba" mode="assign"><const>rgb</const></edit></match>
</fontconfig>
"""

[[commands]]
run = "fc-cache -f"
