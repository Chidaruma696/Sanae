name = "XFCE theme: Catppuccin Mocha"
summary = "Catppuccin Mocha GTK and window theme with Papirus-Dark icons, set as your user's default (the next login applies it)"
category = "Look"
packages = ["papirus-icon-theme"]
aur = ["catppuccin-gtk-theme-mocha"]
check = "test -d /usr/share/themes/catppuccin-mocha-blue-standard+default && grep -q 'catppuccin-mocha-blue-standard+default' ~/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml 2>/dev/null"
notes = "Applies at the next XFCE login. Change it any time in Settings > Appearance."

[[files]]
path = "~/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml"
user = true
content = """<?xml version="1.0" encoding="UTF-8"?>
<channel name="xsettings" version="1.0">
  <property name="Net" type="empty">
    <property name="ThemeName" type="string" value="catppuccin-mocha-blue-standard+default"/>
    <property name="IconThemeName" type="string" value="Papirus-Dark"/>
  </property>
</channel>
"""

[[files]]
path = "~/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml"
user = true
content = """<?xml version="1.0" encoding="UTF-8"?>
<channel name="xfwm4" version="1.0">
  <property name="general" type="empty">
    <property name="theme" type="string" value="catppuccin-mocha-blue-standard+default"/>
  </property>
</channel>
"""
